services:
  scoring-perbakin:
    build: .
    container_name: scoring-perbakin
    restart: unless-stopped
    ports:
      - "127.0.0.1:8098:80"
    volumes:
      - .:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - apps-network

networks:
  apps-network:
    external: true
